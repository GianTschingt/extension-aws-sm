name: Java CI Combined

on: [push, pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      matrix: ${{ steps.lucee-matrix.outputs.MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Repository and organization variables are not passed to pull_request runs from forks, so
      # vars.LUCEE_TEST_VERSIONS_7 is empty there and fromJSON('') fails the whole run before build-and-test starts.
      # Use the variable when it is set, otherwise test the latest build of each Lucee line through
      # a version query (script-runner resolves it), so fork PRs are tested too.
      - name: Resolve Lucee test matrix
        id: lucee-matrix
        env:
          TEST_VERSIONS: ${{ vars.LUCEE_TEST_VERSIONS_7 }}
          # this extension needs Lucee 7.0 or newer (luceeCoreVersion in pom.xml)
          FALLBACK_LINES: "7.0 7.1 8.0"
        run: |
          set -euo pipefail
          if [[ -n "${TEST_VERSIONS// }" ]] && echo "$TEST_VERSIONS" | jq -e 'type == "array" and length > 0' > /dev/null; then
            echo "Using vars.LUCEE_TEST_VERSIONS_7"
            MATRIX=$(echo "$TEST_VERSIONS" | jq -c '.')
          else
            echo "::notice::vars.LUCEE_TEST_VERSIONS_7 is not available (fork pull request?), testing the latest build of: ${FALLBACK_LINES}"
            MATRIX=$(printf '%s\n' $FALLBACK_LINES | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({version: (. + "/all/light"), query: (. + "/all/light")})')
          fi
          # artifact names cannot contain "/", so give every entry a label
          MATRIX=$(echo "$MATRIX" | jq -c 'map(. + {label: ((.version // .query) | gsub("[^A-Za-z0-9._-]"; "-"))})')
          echo "Lucee test matrix: ${MATRIX}"
          echo "MATRIX=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.matrix) }}

    services:
      localstack:
        image: localstack/localstack:3.8.1
        ports:
          - 4566:4566
        env:
          SERVICES: secretsmanager,ssm
          DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: 1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Seed LocalStack
        run: |
          echo "Waiting for LocalStack to be ready..."
          sleep 5

          echo "Seeding LocalStack..."

          # Create secrets in Secrets Manager
          aws --endpoint-url=http://localhost:4566 secretsmanager create-secret \
            --name "mysecret" \
            --secret-string '{"username":"admin","password":"sm-secret"}' \
            --region us-east-1

          aws --endpoint-url=http://localhost:4566 secretsmanager create-secret \
            --name "test-secret" \
            --secret-string 'test-value' \
            --region us-east-1

          # Create parameters in SSM Parameter Store
          aws --endpoint-url=http://localhost:4566 ssm put-parameter \
            --name "myparameter" \
            --value '{"username":"admin","password":"ps-secret"}' \
            --type String \
            --region us-east-1

          aws --endpoint-url=http://localhost:4566 ssm put-parameter \
            --name "test-parameter" \
            --value 'test-value' \
            --type String \
            --region us-east-1

          echo "Done seeding."
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Create .CFConfig.json
        run: |
          # Get version from Maven
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using extension version: $VERSION"
          
          # Create config in workspace root
          cat > ${{ github.workspace }}/.CFConfig.json << EOF
          {
            "secretProvider": {
              "sm": {
                "class": "org.lucee.extension.aws.sm.AWSSecretManagerProvider",
                "maven": "org.lucee:aws-sm:$VERSION",
                "custom": {
                  "accessKeyId": "test",
                  "secretKey": "test",
                  "region": "us-east-1",
                  "endpoint": "http://localhost:4566",
                  "jsonTraversal": true,
                  "timeout": 5000
                }
              },
              "ps": {
                "class": "org.lucee.extension.aws.ssm.AWSParameterStoreProvider",
                "maven": "org.lucee:aws-sm:$VERSION",
                "custom": {
                  "accessKeyId": "test",
                  "secretKey": "test",
                  "region": "us-east-1",
                  "endpoint": "http://localhost:4566",
                  "jsonTraversal": true,
                  "timeout": 5000
                }
              }
            }
          }
          EOF
          
          echo "Created .CFConfig.json"
          cat ${{ github.workspace }}/.CFConfig.json

      - name: Build and Install with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install -Dgoal=install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-sm-lex-${{ matrix.lucee.label }}
          path: |
            target/*.lex
            !target/*.lite.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
          luceeCFConfig: ${{ github.workspace }}/.CFConfig.json
        env:
          testLabels: aws-sm
          testAdditional: ${{ github.workspace }}/tests
          # LocalStack environment variables
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          LOCALSTACK_ENDPOINT: http://localhost:4566

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # publish only from main (push or manual run); PRs and other branches only build and test
    if: >-
      always() && needs.build-and-test.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in org/lucee/aws-sm-extension/; Central then rejects the bundle
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ needs.setup.outputs.version }}" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy --settings maven-settings.xml
          else
            echo "------- Maven Deploy release on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy -DperformRelease=true --settings maven-settings.xml
          fi